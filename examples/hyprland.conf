# Omarchy Pomo — Hyprland
# Abre a TUI em terminal flutuante ao clicar na Waybar.

# Waybar on-click sugerido:
# kitty --class omarchy-pomo -e omarchy-pomo tui

windowrulev2 = float, class:^(omarchy-pomo)$
windowrulev2 = center, class:^(omarchy-pomo)$
windowrulev2 = size 700 420, class:^(omarchy-pomo)$
windowrulev2 = stayfocused, class:^(omarchy-pomo)$
